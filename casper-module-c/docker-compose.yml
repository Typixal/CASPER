# CASPER Module C -- local demo stack.
#
# Two services only:
#   portal  - the Flask demo portal, scaled horizontally by the scale controller
#   nginx   - the single public entry point / load balancer on port 8080
#
# Scale with:  docker compose up -d --scale portal=N
# (or, preferred, via: python controller/scale_controller.py N)

services:
  portal:
    build: ./portal
    # expose, NOT ports: the portal must only be reachable through nginx.
    # This mirrors the real-world pattern where app servers sit behind a
    # load balancer and are never addressed directly.
    expose:
      - "5000"
    environment:
      MIN_DELAY_MS: "20"
      MAX_DELAY_MS: "120"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    ports:
      # The ONE port published to the host. k6 and curl target this.
      - "8080:80"
    volumes:
      # Generated file (written by the scale controller), mounted read-only.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portal
