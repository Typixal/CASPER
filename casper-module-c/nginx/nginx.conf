# CASPER nginx TEMPLATE (Module C)
#
# THIS is the file to edit by hand.
# The scale controller reads this template, replaces the block between the
# AUTO-GENERATED markers with the list of currently healthy portal replicas,
# and writes the result to nginx/nginx.conf. That generated file is what the
# nginx container actually mounts -- never edit it directly.

events {
    worker_connections 1024;
}

http {
    # Compact access log line that records which upstream replica served the
    # request. Useful evidence when demonstrating load balancing.
    log_format casper '$remote_addr - [$time_local] "$request" '
                      '$status ${request_time}s upstream=$upstream_addr';
    access_log /var/log/nginx/access.log casper;

    upstream portal_backend {
# --- BEGIN AUTO-GENERATED SERVERS ---
        server casper-module-c-portal-1:5000;
        server casper-module-c-portal-2:5000;
        server casper-module-c-portal-3:5000;
        server casper-module-c-portal-4:5000;
# --- END AUTO-GENERATED SERVERS ---
    }

    server {
        listen 80;

        location / {
            proxy_pass http://portal_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Short timeouts: a replica that died should fail fast rather than
            # hanging the request and inflating Module D's response-time data.
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
