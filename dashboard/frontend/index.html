<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/dist/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASPER — Live Demo Dashboard</title>

    <!--
      Webfonts are the one thing loaded live from a CDN. Every JS library
      (recharts, lucide, framer-motion) is compiled into the bundle instead,
      so a slow or blocked network costs at most the typeface: the font
      stacks in index.css fall back to system sans/mono and the dashboard
      keeps working.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
